# CI Laravel da casa — workflow reutilizável.
#
# Chamada mínima, no repo consumidor:
#
#   jobs:
#     ci:
#       uses: evocode-ia/evocode-ci/.github/workflows/laravel-ci.yml@v1
#       with:
#         php-version: "8.4"
#
# As decisões embutidas aqui saíram de bugs reais, não de preferência — os
# porquês estão comentados passo a passo. Leia antes de mudar qualquer um.
name: Laravel CI

on:
  workflow_call:
    inputs:
      php-version:
        description: 'Versão do PHP. Tem que ser a que o composer.lock exige, não a declarada no composer.json.'
        required: true
        type: string
      node-version:
        description: 'Versão do Node.'
        required: false
        type: string
        default: '24'
      working-directory:
        description: 'Diretório do Laravel, quando ele não fica na raiz do repositório.'
        required: false
        type: string
        default: '.'
      php-extensions:
        description: 'Extensões extras do PHP, separadas por vírgula.'
        required: false
        type: string
        default: ''
      phpstan:
        description: 'Roda o PHPStan no job de qualidade.'
        required: false
        type: boolean
        default: true
      frontend:
        description: 'Instala e builda o frontend antes dos testes. Suíte que renderiza Inertia precisa do manifest do Vite.'
        required: false
        type: boolean
        default: true
      frontend-lint:
        description: 'Roda npm run lint no job de qualidade.'
        required: false
        type: boolean
        default: false
      composer-audit:
        description: 'Roda composer audit no job de qualidade.'
        required: false
        type: boolean
        default: true
      coverage:
        description: 'Mede a cobertura de testes com pcov e publica o número no resumo do job. Sem gate — o objetivo é ter o número.'
        required: false
        type: boolean
        default: false
      baseline-gate:
        description: 'Falha o PR se o phpstan-baseline.neon crescer em relação à branch alvo.'
        required: false
        type: boolean
        default: true
      sqlite-file:
        description: 'Cria database/database.sqlite antes dos testes.'
        required: false
        type: boolean
        default: true
      mysql:
        description: 'Sobe um MySQL de serviço para a suíte, em vez de sqlite. Use quando o phpunit.xml aponta para MySQL.'
        required: false
        type: boolean
        default: false
      mysql-version:
        description: 'Tag da imagem do MySQL de serviço.'
        required: false
        type: string
        default: '8.4'
      mysql-database:
        description: 'Nome do banco criado no serviço. Tem que bater com o DB_DATABASE do phpunit.xml.'
        required: false
        type: string
        default: 'testing'

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1
  COMPOSER_PROCESS_TIMEOUT: 0

jobs:
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5
        with:
          # O gate de baseline compara com o alvo do PR; precisa do histórico.
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          tools: composer:v2
          # Nunca xdebug sem alguém consumindo cobertura: além de multiplicar o
          # tempo, o overhead de memória derruba suítes grandes.
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - name: Pint
        run: vendor/bin/pint --test
      - name: PHPStan
        if: ${{ inputs.phpstan }}
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      # "O baseline só encolhe" só é regra se alguém verificar. Sem isto, basta
      # regenerar o arquivo para esconder erro novo — e ninguém percebe.
      - name: Baseline não pode crescer
        if: ${{ inputs.phpstan && inputs.baseline-gate && github.event_name == 'pull_request' }}
        run: |
          arquivo="phpstan-baseline.neon"
          if [ ! -f "$arquivo" ]; then
            echo "Sem baseline neste projeto — nada a comparar."
            exit 0
          fi
          soma() { awk '/count:/{s+=$2} END{print s+0}'; }
          atual=$(soma < "$arquivo")
          caminho="${{ inputs.working-directory }}"
          [ "$caminho" = "." ] && alvo="$arquivo" || alvo="$caminho/$arquivo"
          if ! git cat-file -e "origin/${{ github.base_ref }}:$alvo" 2>/dev/null; then
            echo "A branch alvo ainda não tem baseline — este PR está adotando um. Liberado."
            exit 0
          fi
          base=$(git show "origin/${{ github.base_ref }}:$alvo" | soma)
          echo "baseline na ${{ github.base_ref }}: $base"
          echo "baseline neste PR:      $atual"
          if [ "$atual" -gt "$base" ]; then
            echo "::error::O baseline cresceu de $base para $atual. Corrija o erro novo em vez de congelá-lo."
            exit 1
          fi
          if [ "$atual" -lt "$base" ]; then
            echo "::notice::Baseline encolheu $((base - atual)) erros. 👏"
          fi
      - uses: actions/setup-node@v4
        if: ${{ inputs.frontend-lint }}
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Lint do frontend
        if: ${{ inputs.frontend-lint }}
        run: |
          npm ci
          npm run lint
      - name: Auditoria de dependências
        if: ${{ inputs.composer-audit }}
        run: composer audit

  # Há dois jobs de teste porque o GitHub não aceita `if:` em `services:` —
  # só um deles roda, escolhido pela entrada `mysql`. A duplicação fica aqui,
  # num lugar só, em vez de espalhada pelos repositórios.
  testes:
    name: Testes
    if: ${{ ! inputs.mysql }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          tools: composer:v2
          # pcov quando há cobertura a medir: é ordens de grandeza mais barato
          # que o xdebug, que fica proibido justamente por ser caro e por
          # mascarar recursão real.
          coverage: ${{ inputs.coverage && 'pcov' || 'none' }}
      - uses: actions/setup-node@v4
        if: ${{ inputs.frontend }}
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - run: composer install --prefer-dist --no-progress
      # A ordem abaixo não é decorativa. O .env tem que existir antes do
      # artisan; o ziggy é gerado pelo artisan e não é versionado; e o build
      # do frontend depende dele.
      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Banco sqlite
        if: ${{ inputs.sqlite-file }}
        run: touch database/database.sqlite
      - name: Gerar rotas do Ziggy
        if: ${{ inputs.frontend }}
        run: |
          if composer show tightenco/ziggy >/dev/null 2>&1; then
            php artisan ziggy:generate
          fi
      - name: Build do frontend
        if: ${{ inputs.frontend }}
        run: |
          npm ci
          npm run build
      - name: Pest
        if: ${{ ! inputs.coverage }}
        run: php artisan test
      - name: Pest com cobertura
        if: ${{ inputs.coverage }}
        run: |
          set -o pipefail
          php artisan test --coverage 2>&1 | tee /tmp/cobertura.txt
          pct=$(grep -oE 'Total: *[0-9.]+ *%' /tmp/cobertura.txt | tail -1 | grep -oE '[0-9.]+' | head -1)
          echo "### Cobertura de testes: ${pct:-n/d}%" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Cobertura de testes: ${pct:-n/d}%"

  testes-mysql:
    name: Testes
    if: ${{ inputs.mysql }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      mysql:
        image: mysql:${{ inputs.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ${{ inputs.mysql-database }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          tools: composer:v2
          # pcov quando há cobertura a medir: é ordens de grandeza mais barato
          # que o xdebug, que fica proibido justamente por ser caro e por
          # mascarar recursão real.
          coverage: ${{ inputs.coverage && 'pcov' || 'none' }}
      - uses: actions/setup-node@v4
        if: ${{ inputs.frontend }}
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - run: composer install --prefer-dist --no-progress
      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
      # O .env.example aponta para o host do compose local (mysql). No runner o
      # serviço responde em 127.0.0.1, então as credenciais são reescritas.
      - name: Apontar o banco para o serviço
        run: |
          sed -i -E "s/^DB_HOST=.*/DB_HOST=127.0.0.1/" .env
          sed -i -E "s/^DB_PORT=.*/DB_PORT=3306/" .env
          sed -i -E "s/^DB_DATABASE=.*/DB_DATABASE=${{ inputs.mysql-database }}/" .env
          sed -i -E "s/^DB_USERNAME=.*/DB_USERNAME=root/" .env
          sed -i -E "s/^DB_PASSWORD=.*/DB_PASSWORD=password/" .env
      - name: Gerar rotas do Ziggy
        if: ${{ inputs.frontend }}
        run: |
          if composer show tightenco/ziggy >/dev/null 2>&1; then
            php artisan ziggy:generate
          fi
      - name: Build do frontend
        if: ${{ inputs.frontend }}
        run: |
          npm ci
          npm run build
      - name: Pest
        if: ${{ ! inputs.coverage }}
        run: php artisan test
      - name: Pest com cobertura
        if: ${{ inputs.coverage }}
        run: |
          set -o pipefail
          php artisan test --coverage 2>&1 | tee /tmp/cobertura.txt
          pct=$(grep -oE 'Total: *[0-9.]+ *%' /tmp/cobertura.txt | tail -1 | grep -oE '[0-9.]+' | head -1)
          echo "### Cobertura de testes: ${pct:-n/d}%" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Cobertura de testes: ${pct:-n/d}%"

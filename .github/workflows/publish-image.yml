name: Reusable - publish image

# Publicação de imagem no Docker Hub ou no GitHub Container Registry, em um
# lugar só. O registry vem do input `registry` (`docker.io`, o padrão, ou
# `ghcr.io`); ver a ADR-0012 da camada nexthop-dev-standards.
#
# Antes deste arquivo o job vivia copiado em cada projeto (kairo, tracelog,
# agentenoc, painel-agentenoc, ia-mcps, http-mcps, helpdesk). Cópia diverge:
# em 25/08/2026 o kairo passou quatro dias sem publicar imagem nenhuma porque
# o campo de usuário guardava um token, e a checagem local só testava se o
# secret estava vazio — um valor presente e errado passava direto.
#
# Duas decisões saíram daquele diagnóstico e valem para todo projeto:
#
# 1. O NOME DE USUÁRIO NÃO É SEGREDO. É o namespace público, já escrito em
#    claro na tag da imagem. Guardá-lo como secret não protegia nada e custava
#    a visibilidade que teria encurtado o diagnóstico para um minuto — o log
#    mascarava o valor, e por isso ninguém notou que o campo tinha 36
#    caracteres em vez de 9. Entra como `input`, vindo de uma variável do
#    repositório. Só o token é `secret`.
#
# 2. VALIDAR FORMATO, NÃO PRESENÇA. `docker login` monta o header
#    `Basic base64(usuario:token)`; uma quebra de linha colada junto com o
#    valor corrompe o header e o registry responde "malformed HTTP
#    Authorization header", mensagem que não menciona credencial e manda
#    procurar no lugar errado. Um pré-voo contra `auth.docker.io` traduz isso
#    para um código HTTP legível antes de o login acontecer.
#
# Actions fixadas por SHA de 40 caracteres, não por major (@v4, @v7): este é o
# job que autentica no Docker Hub e roda com `push: true`. Tag de major é
# ponteiro móvel — repositório da action comprometido muda o que estes passos
# fazem sem mudar uma linha aqui.
#
# PERMISSÕES VÊM DE QUEM CHAMA. Este arquivo não declara `permissions`: um
# workflow chamado só pode manter ou reduzir o que o job chamador concedeu,
# nunca ampliar. Declarar `packages: write` aqui pediria mais do que os
# chamadores do Docker Hub concedem (todos fixam `contents: read`), e declarar
# só `contents: read` cortaria o `packages: write` de que o GHCR precisa. Quem
# publica no GHCR concede, no job que chama:
#
#   permissions:
#     contents: read
#     packages: write
#
# Quem publica no Docker Hub não muda nada.

on:
  workflow_call:
    inputs:
      registry:
        description: >-
          Registry de destino: `docker.io` (padrão) ou `ghcr.io`. No `ghcr.io`
          o login usa o `GITHUB_TOKEN` do job chamador, que precisa conceder
          `packages: write`, e o usuário é o ator do workflow; `username` e o
          secret `DOCKERHUB_TOKEN` ficam sem uso. As tags têm de começar pelo
          mesmo registry (`ghcr.io/<dono>/<imagem>:<tag>`), em minúsculas.
        required: false
        type: string
        default: docker.io
      runs-on:
        description: >-
          Onde rodar, em JSON. Runner próprio: `["self-hosted","evocode-linux"]`.
          O padrão usa minutos pagos do GitHub.
        required: false
        type: string
        default: '"ubuntu-latest"'
      tags:
        description: >-
          Tags completas (`repo:tag`), uma por linha — mesmo formato que
          `docker/build-push-action` espera. Quem chama calcula; este workflow
          publica o que recebe.
        required: true
        type: string
      username:
        description: >-
          Nome de usuário do Docker Hub. Passe a variável do repositório
          `vars.DOCKERHUB_USERNAME` — NÃO um secret. Ver o comentário no topo.
          Obrigatório com `registry: docker.io`; ignorado com `ghcr.io`.
          (Sem a sintaxe de expressão nesta descrição de propósito: o GitHub a
          avalia mesmo aqui, e um exemplo escrito por extenso invalida o
          arquivo inteiro antes de qualquer job começar.)
        required: false
        type: string
        default: ''
      context:
        description: Contexto do build.
        required: false
        type: string
        default: .
      file:
        description: Caminho do Dockerfile.
        required: false
        type: string
        default: ./Dockerfile
      platforms:
        description: >-
          Declarado, e não herdado do runner: os nós de produção são amd64, e
          uma imagem construída em arm64 não roda lá. Deixar implícito funciona
          só enquanto o runner for amd64.
        required: false
        type: string
        default: linux/amd64
      labels:
        description: Labels OCI, no formato que `docker/build-push-action` espera.
        required: false
        type: string
        default: ''
      target:
        description: Estágio do Dockerfile a construir, quando multi-stage.
        required: false
        type: string
        default: ''
      build-args:
        description: >-
          Argumentos de build (`NOME=valor`, um por linha), repassados ao
          `docker/build-push-action`. Para dado do próprio build que a imagem
          precisa carregar e o contexto não tem, como o commit e a data (o
          `.git` costuma ficar fora pelo `.dockerignore`). Nunca segredo:
          argumento de build fica gravado no histórico da imagem. Vazio não
          passa nenhum.
        required: false
        type: string
        default: ''
      description-repository:
        description: >-
          `namespace/repo` cuja descrição no Docker Hub deve ser atualizada a
          partir do README. Vazio desliga o passo. Só vale com
          `registry: docker.io`; com `ghcr.io` o pré-voo recusa.
        required: false
        type: string
        default: ''
      short-description:
        description: Descrição curta do repositório no Docker Hub.
        required: false
        type: string
        default: ''
      readme-filepath:
        description: Caminho do README publicado como descrição longa.
        required: false
        type: string
        default: ./README.md
      cache-scope:
        description: >-
          Escopo próprio do cache `type=gha`, não o namespace default
          compartilhado por todo o repositório. Este job tem credencial de
          registry; escopo isolado garante que ele só lê o que ele mesmo
          escreveu, e não uma entrada envenenada por outro job da esteira.
        required: false
        type: string
        default: publish-image
      timeout-minutes:
        description: >-
          Teto do job, em minutos. O padrão serve a imagem comum. Imagem com
          camadas de gigabytes, construída em runner próprio com rede lenta
          até o cache `type=gha` ou até a origem dos modelos, pede mais: em
          23/11/2026 a do rag-sync do agentenoc precisou de ~3,5 h só para
          baixar ~115 MB do cache e ~530 MB de modelos do Hugging Face, a
          ~50 KB/s, e era cancelada aos 45 min em todo merge.
        required: false
        type: number
        default: 45
    secrets:
      DOCKERHUB_TOKEN:
        description: >-
          Token do Docker Hub (Read & Write). Obrigatório com
          `registry: docker.io`.
        required: false

jobs:
  publish-image:
    name: Publish image (${{ inputs.registry }})
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Vale para os dois registries: login num registry e tag apontando para
      # outro termina em "denied" no push, sem dizer que o destino estava
      # errado. Aqui o erro nomeia a tag.
      - name: Confere o registry e as tags
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          TAGS: ${{ inputs.tags }}
          DESCRIPTION_REPOSITORY: ${{ inputs.description-repository }}
        run: |
          set -uo pipefail

          case "$REGISTRY" in
            docker.io|ghcr.io) ;;
            *)
              echo "::error::registry '${REGISTRY}' não é suportado. Use docker.io ou ghcr.io."
              exit 1
              ;;
          esac

          if [ "$REGISTRY" != docker.io ] && [ -n "$DESCRIPTION_REPOSITORY" ]; then
            echo "::error::description-repository atualiza a descrição no Docker Hub e só vale com registry docker.io."
            exit 1
          fi

          invalido=0
          total=0
          while IFS= read -r tag; do
            tag="$(printf '%s' "$tag" | tr -d '[:blank:]')"
            [ -z "$tag" ] && continue
            total=$((total + 1))

            # O primeiro segmento é host de registry quando tem ponto, dois
            # pontos ou é `localhost` (mesma regra do Docker); sem host, a
            # referência é do Docker Hub.
            primeiro="${tag%%/*}"
            host=docker.io
            if [ "$primeiro" != "$tag" ]; then
              case "$primeiro" in
                *.*|*:*|localhost) host="$primeiro" ;;
              esac
            fi
            [ "$host" = index.docker.io ] && host=docker.io

            if [ "$host" != "$REGISTRY" ]; then
              echo "::error::A tag '${tag}' aponta para ${host}, mas o login é em ${REGISTRY}."
              invalido=1
            fi

            if [ "$REGISTRY" = ghcr.io ] && [ "$tag" != "$(printf '%s' "$tag" | tr '[:upper:]' '[:lower:]')" ]; then
              echo "::error::A tag '${tag}' tem maiúscula; o ghcr.io só aceita repositório em minúsculas."
              invalido=1
            fi
          done <<< "$TAGS"

          if [ "$total" -eq 0 ]; then
            echo "::error::\`tags\` veio vazio — não há o que publicar."
            exit 1
          fi

          exit "$invalido"

      - name: Confere as credenciais do Docker Hub
        if: inputs.registry == 'docker.io'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ inputs.username }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -uo pipefail
          invalido=0

          confere() {
            local nome="$1" valor="$2"

            if [ -z "$valor" ]; then
              echo "::error::${nome} está vazio. O usuário vem de \`vars.DOCKERHUB_USERNAME\` (variável do repositório); o token, de \`secrets.DOCKERHUB_TOKEN\`."
              invalido=1
              return
            fi

            # `tr -cd` guarda só o ASCII imprimível sem espaço; se sobrou menos
            # do que entrou, havia quebra de linha, tab, espaço ou acento vindo
            # de uma cópia com formatação. `grep -P` faria o mesmo, mas é
            # GNU-only e não dá para validar a regra fora do runner.
            local limpo
            limpo="$(printf '%s' "$valor" | LC_ALL=C tr -cd '\41-\176')"

            if [ "$limpo" != "$valor" ]; then
              echo "::error::${nome} contém espaço, quebra de linha ou caractere não-ASCII. Regrave sem o caractere extra."
              invalido=1
            fi
          }

          confere DOCKERHUB_USERNAME "${DOCKERHUB_USERNAME}"
          confere DOCKERHUB_TOKEN "${DOCKERHUB_TOKEN}"

          # O Docker Hub autentica por NOME DE USUÁRIO; o e-mail da conta é
          # recusado com a mesma mensagem genérica de senha errada.
          case "${DOCKERHUB_USERNAME}" in
            *@*)
              echo "::error::DOCKERHUB_USERNAME parece ser um e-mail. Use o nome de usuário da conta no Docker Hub."
              invalido=1
              ;;
          esac

          if [ "$invalido" -ne 0 ]; then
            exit 1
          fi

          # Escopo pedido ao auth: o repositório da primeira tag recebida, que
          # é exatamente onde o build vai empurrar.
          # Primeira linha não-vazia, sem a tag. Tolera o newline com que um
          # bloco YAML costuma começar e o espaço de indentação.
          # O prefixo `docker.io/` (ou `index.docker.io/`), quando vem, sai:
          # o escopo do auth é só `namespace/repo`.
          repositorio="$(printf '%s\n' "$TAGS" | tr -d '[:blank:]' | sed '/^$/d' | head -1 | sed 's/:[^:/]*$//' | sed -E 's#^(index\.)?docker\.io/##')"

          if [ -z "$repositorio" ]; then
            echo "::error::\`tags\` veio vazio — não há o que publicar."
            exit 1
          fi

          # Pré-voo. O `docker/login-action` traduz qualquer problema para uma
          # mensagem do daemon que não diz o que houve; aqui o código HTTP
          # separa os casos.
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repositorio}:pull,push")"

          echo "Auth do Docker Hub para ${repositorio}: HTTP ${status}."
          echo "Tamanho de DOCKERHUB_USERNAME: ${#DOCKERHUB_USERNAME}; de DOCKERHUB_TOKEN: ${#DOCKERHUB_TOKEN}."

          case "$status" in
            200) ;;
            401)
              echo "::error::O Docker Hub recusou a credencial (401). Confira que \`vars.DOCKERHUB_USERNAME\` é o nome de usuário da conta e que o token está ativo, com escopo Read & Write."
              exit 1
              ;;
            *)
              echo "::error::A API de auth do Docker Hub respondeu ${status}. Token com comprimento inesperado costuma indicar valor truncado na hora de gravar o secret."
              exit 1
              ;;
          esac

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login no Docker Hub
        if: inputs.registry == 'docker.io'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ inputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `GITHUB_TOKEN` do job chamador: sem segredo para guardar nem rotacionar,
      # e o pacote nasce ligado ao repositório que publicou. Sem
      # `packages: write` concedido por quem chama, o push volta "denied".
      - name: Login no GitHub Container Registry
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.labels }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
          provenance: false

      # Só quem pede. A descrição no Docker Hub é a primeira coisa que alguém
      # de fora lê sobre a imagem, e mantê-la junto do push evita que ela
      # descreva uma versão que já saiu do ar.
      - name: Atualiza a descrição no Docker Hub
        if: inputs.registry == 'docker.io' && inputs.description-repository != ''
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ inputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ inputs.description-repository }}
          short-description: ${{ inputs.short-description }}
          readme-filepath: ${{ inputs.readme-filepath }}

      - name: Publica as tags no resumo do job
        shell: bash
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          {
            echo "### Imagem publicada"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
